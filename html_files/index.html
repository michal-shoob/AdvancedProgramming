<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Computational Graph Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #1e1e2e; font-family: Arial, sans-serif; overflow: hidden; }
    .panel { display: flex; flex-direction: column; }
    .panel-title { background: #313244; color: #89b4fa; font-size: 0.72em; padding: 4px 10px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    iframe { flex: 1; border: none; width: 100%; display: block; }
    #left  { width: 210px; min-width: 180px; border-right: 1px solid #313244; }
    #center { flex: 1; border-right: 1px solid #313244; }
    #right { width: 200px; min-width: 160px; }
  </style>
</head>
<body>
  <div class="panel" id="left">
    <div class="panel-title">Controls</div>
    <iframe src="http://localhost:8080/app/form.html" name="left_frame"></iframe>
  </div>
  <div class="panel" id="center">
    <div class="panel-title">Graph View</div>
    <iframe src="http://localhost:8080/app/temp.html" name="graph_frame"></iframe>
  </div>
  <div class="panel" id="right">
    <div class="panel-title">Topic Values</div>
    <iframe src="http://localhost:8080/app/temp.html" name="values_frame"></iframe>
  </div>
</body>
</html>
