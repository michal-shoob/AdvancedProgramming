<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #181825; color: #cdd6f4; padding: 12px; font-size: 13px; }
    h4 { color: #89b4fa; margin: 0 0 8px; font-size: 0.9em; border-bottom: 1px solid #313244; padding-bottom: 4px; }
    .section { background: #1e1e2e; border: 1px solid #313244; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
    label { display: block; margin-bottom: 3px; color: #a6adc8; font-size: 0.82em; }
    input[type=text], input[type=file] { width: 100%; padding: 5px 7px; background: #313244; border: 1px solid #45475a; border-radius: 4px; color: #cdd6f4; font-size: 12px; margin-bottom: 8px; }
    input[type=submit] { width: 100%; padding: 6px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    input[type=submit]:hover { background: #74c7ec; }
  </style>
</head>
<body>
  <div class="section">
    <h4>Load Configuration</h4>
    <form action="http://localhost:8080/upload" method="POST" enctype="multipart/form-data" target="graph_frame">
      <label>Config file:</label>
      <input type="file" name="file" accept=".conf,.txt">
      <input type="submit" value="Deploy">
    </form>
  </div>
  <div class="section">
    <h4>Send Message</h4>
    <form action="http://localhost:8080/publish" method="GET" target="values_frame">
      <label>Topic name:</label>
      <input type="text" name="topic" placeholder="e.g. A">
      <label>Message:</label>
      <input type="text" name="message" placeholder="e.g. 5.0">
      <input type="submit" value="Send">
    </form>
  </div>
</body>
</html>
